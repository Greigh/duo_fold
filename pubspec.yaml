name: duo_fold
description: "Fold-aware layout for Apple's iPhone Duo in Flutter: pose derivation, split panes, and fold-confined sheets and dialogs, built on package:foldable."
repository: https://github.com/Greigh/duo_fold
homepage: https://github.com/Greigh/duo_fold
version: 0.1.0
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  foldable: ^1.0.5
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
